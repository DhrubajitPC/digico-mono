name: CI/CD Pipeline

on:
  push:
    branches: [main, "feat/*", "fix/*", "feature/*"]
  pull_request:
    branches: [main]

concurrency:
  group: digico-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # setup-vp provisions Node.js, downloads the pnpm version pinned in
      # devEngines.packageManager, and caches the pnpm store, replacing the
      # separate pnpm/action-setup + setup-node + manual cache steps.
      #
      # node-version is pinned to 22 to match the node:22-alpine runtime both
      # Dockerfiles build on. Left unset, vp resolves engines.node (">=22.18.0")
      # to the latest satisfying release (24.x), which would test CI on a Node
      # version production never runs.
      - name: Set up Vite+ Toolchain
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22
          cache: true
          run-install: false

      - name: Install Dependencies
        run: vp install --frozen-lockfile

      # Covers every workspace, not just website + whatsapp-webhook.
      - name: Format, lint & typecheck
        run: vp check

      - name: Unit tests
        run: vp run -r test

      - name: Test CI deploy entrypoint script
        run: make test-entrypoint

      # Only `website` has a meaningful build: the backend runs TypeScript directly
      # via --experimental-strip-types, and `packages/utils` is orphaned with a
      # broken `vp pack` (missing @typescript/native-preview).
      - name: Build frontend bundle
        run: vp run website#build

      # Exercises both Dockerfiles so a broken image fails here rather than
      # halfway through a production deploy. compose requires .env to exist.
      - name: Build production images
        run: |
          cp .env.example .env
          docker compose build

  deploy:
    name: Deploy to Production Server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Fail before touching the server: a missing secret would otherwise be
      # written to the server's .env as an empty value and break production.
      - name: Verify required secrets are present
        env:
          DIGICO_DEPLOY_SSH_KEY: ${{ secrets.DIGICO_DEPLOY_SSH_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          missing=()
          for key in DIGICO_DEPLOY_SSH_KEY DEEPSEEK_API_KEY WHATSAPP_ACCESS_TOKEN \
                     WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required repository secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All required secrets are present."

      - name: Configure restricted SSH credential
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DIGICO_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/digico_deploy
          chmod 600 ~/.ssh/digico_deploy
          printf '%s\n' '[103.191.50.48]:44444 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFpOm4izPb8lFnXL2deniukzGxs1gfcLvhc5nOEMuipo' > ~/.ssh/known_hosts

      # No remote command is sent. The deploy account's authorized_keys pins the CI
      # key to a forced command, digico-ci-entrypoint (tracked at
      # ../../digico-ci-entrypoint in this repo, installed at
      # /usr/local/libexec/digico-ci-entrypoint on the server), which reads this
      # environment payload from stdin and deploys.
      #
      # Verified by reading the live script: arbitrary remote commands are refused
      # (SSH_ORIGINAL_COMMAND non-empty -> exit 126); every payload key is checked
      # against the keys declared in the repo's .env.example (fetched fresh from
      # origin/main first) and the WHOLE payload is rejected on the first
      # unrecognized key; and /srv/digico/.env is written via mktemp + chmod 600 +
      # atomic mv, never truncated by an empty payload.
      #
      # ELEVENLABS_API_KEY is deliberately absent from the required-secrets check
      # above: voice transcription is optional, and its absence degrades gracefully
      # (transcribeAudio throws a configuration error, handleIncomingMessage catches
      # it and asks the dealer to type instead).
      #
      # Its line is emitted only when the secret is non-empty, so an unset secret
      # cannot fail unrelated deploys. Any new variable added here must also be
      # added to .env.example — the entrypoint rejects the whole payload otherwise.
      - name: Deploy
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          {
            printf 'PORT=8787\n'
            printf 'NODE_ENV=production\n'
            printf 'DEEPSEEK_MODEL=%s\n'          "$DEEPSEEK_MODEL"
            printf 'DEEPSEEK_API_KEY=%s\n'        "$DEEPSEEK_API_KEY"
            if [ -n "$ELEVENLABS_API_KEY" ]; then
              printf 'ELEVENLABS_API_KEY=%s\n'    "$ELEVENLABS_API_KEY"
            fi
            printf 'WHATSAPP_ACCESS_TOKEN=%s\n'   "$WHATSAPP_ACCESS_TOKEN"
            printf 'WHATSAPP_PHONE_NUMBER_ID=%s\n' "$WHATSAPP_PHONE_NUMBER_ID"
            printf 'WHATSAPP_VERIFY_TOKEN=%s\n'   "$WHATSAPP_VERIFY_TOKEN"
          } | ssh -i ~/.ssh/digico_deploy -p 44444 \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                deploy@103.191.50.48
