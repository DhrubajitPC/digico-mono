name: CI/CD Pipeline

on:
  push:
    branches: [main, feat/order-dashboard-design-system]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Vite+ Toolchain
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: true

      - name: Code Quality & Type Check
        run: pnpm exec vp check

      - name: Run Unit & Integration Test Suite
        run: pnpm exec vp test

      - name: Verify Frontend Production Build
        run: pnpm --filter website build

  deploy:
    name: Deploy to Production Server
    needs: test
    # Only deploy when pushing to main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            echo "Pulling latest changes and rebuilding containers..."
            cd /opt/digico || cd ~/digico
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
