name: CI/CD Pipeline

on:
  push:
    branches: [main, "feat/*", "fix/*", "feature/*"]
  pull_request:
    branches: [main]

concurrency:
  group: digico-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Vite+ Toolchain
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: false
          run-install: false

      # Covers all five workspaces, not just website + whatsapp-webhook.
      - name: Format, lint & typecheck
        run: pnpm exec vp check

      - name: Unit tests
        run: pnpm -r test

      # Only `website` has a meaningful build: the backend runs TypeScript directly
      # via --experimental-strip-types, and `packages/utils` is orphaned with a
      # broken `vp pack` (missing @typescript/native-preview).
      - name: Build frontend bundle
        run: pnpm --filter website build

      # Exercises both Dockerfiles so a broken image fails here rather than
      # halfway through a production deploy. compose requires .env to exist.
      - name: Build production images
        run: |
          cp .env.example .env
          docker compose build

  deploy:
    name: Deploy to Production Server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Fail before touching the server: a missing secret would otherwise be
      # written to the server's .env as an empty value and break production.
      - name: Verify required secrets are present
        env:
          DIGICO_DEPLOY_SSH_KEY: ${{ secrets.DIGICO_DEPLOY_SSH_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          missing=()
          for key in DIGICO_DEPLOY_SSH_KEY DEEPSEEK_API_KEY WHATSAPP_ACCESS_TOKEN \
                     WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required repository secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All required secrets are present."

      - name: Configure restricted SSH credential
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DIGICO_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/digico_deploy
          chmod 600 ~/.ssh/digico_deploy
          printf '%s\n' '[103.191.50.48]:44444 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFpOm4izPb8lFnXL2deniukzGxs1gfcLvhc5nOEMuipo' > ~/.ssh/known_hosts

      # No remote command is sent. The forced command in the deploy account's
      # authorized_keys runs digico-ci-entrypoint, which reads this environment
      # payload from stdin, validates every key against a whitelist, writes
      # /srv/digico/.env (0600), then invokes the deployment routine via sudo.
      - name: Deploy
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          {
            printf 'PORT=8787\n'
            printf 'NODE_ENV=production\n'
            printf 'DEEPSEEK_MODEL=%s\n'          "$DEEPSEEK_MODEL"
            printf 'DEEPSEEK_API_KEY=%s\n'        "$DEEPSEEK_API_KEY"
            printf 'WHATSAPP_ACCESS_TOKEN=%s\n'   "$WHATSAPP_ACCESS_TOKEN"
            printf 'WHATSAPP_PHONE_NUMBER_ID=%s\n' "$WHATSAPP_PHONE_NUMBER_ID"
            printf 'WHATSAPP_VERIFY_TOKEN=%s\n'   "$WHATSAPP_VERIFY_TOKEN"
          } | ssh -i ~/.ssh/digico_deploy -p 44444 \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                deploy@103.191.50.48
