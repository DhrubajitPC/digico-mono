name: CI/CD Pipeline

on:
  push:
    branches: [main, "feat/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Vite+ Toolchain
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: false
          run-install: false

      - name: Code Quality & Type Check
        run: pnpm --filter whatsapp-webhook check && pnpm --filter website exec vp check

      - name: Verify Frontend Production Build
        run: pnpm --filter website build

  deploy:
    name: Deploy to Production Server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            echo "Pulling latest changes and rebuilding containers..."
            cd /opt/digico || cd ~/digico
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
