name: digico-app

services:
  # MariaDB WooCommerce Database Service
  mariadb:
    image: mariadb:11.8
    container_name: digico-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-woocommerce_local}
      MARIADB_USER: ${MARIADB_USER:-wp}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-wp}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --max-allowed-packet=512M
      - --innodb-buffer-pool-size=1G
    volumes:
      - digico_mariadb_data:/var/lib/mysql
      - ./data/mariadb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - digico-network

  # Fastify REST API Backend Service
  backend:
    build:
      context: .
      dockerfile: apps/whatsapp-webhook/Dockerfile
    container_name: digico-backend
    restart: unless-stopped
    ports:
      - "8787:8787"
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8787}
      - MARIADB_URL=mysql://${MARIADB_USER:-wp}:${MARIADB_PASSWORD:-wp}@mariadb:3306/${MARIADB_DATABASE:-woocommerce_local}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-digico_default_verify_token_12345}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8787/health'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - digico-network

  # React 19 Frontend Web App (Nginx Web Server)
  frontend:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    container_name: digico-frontend
    restart: unless-stopped
    ports:
      # No host port 80 here: Caddy owns 80/443 on the host and reverse-proxies
      # to this container internally. 5173 stays for direct/no-TLS debugging.
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Must be 127.0.0.1, not localhost: the container resolves localhost to ::1
      # first, but this image's nginx binds 0.0.0.0:80 only (its default.conf has
      # no `listen [::]:80;`, and 10-listen-on-ipv6-by-default.sh skips patching a
      # customised config), so a localhost probe gets ECONNREFUSED forever.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - digico-network

  # Caddy Reverse Proxy — terminates TLS for digicoaibot.xyz and automatically
  # obtains/renews its Let's Encrypt certificate (HTTP-01 challenge on :80).
  caddy:
    image: caddy:2-alpine
    container_name: digico-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - digico_caddy_data:/data
      - digico_caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - digico-network

volumes:
  digico_mariadb_data:
    driver: local
  digico_caddy_data:
    driver: local
  digico_caddy_config:
    driver: local

networks:
  digico-network:
    driver: bridge
