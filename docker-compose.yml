name: digico-app

services:
  # Fastify REST API Backend Service
  backend:
    build:
      context: .
      dockerfile: apps/whatsapp-webhook/Dockerfile
    container_name: digico-backend
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - DB_DATA_DIR=/app/data/db
      - DATABASE_URL=${DATABASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-digico_webhook_secret_token}
    volumes:
      - pglite_data:/app/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8787/api/orders'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - digico-network

  # React 19 Frontend Web App (Nginx Web Server)
  frontend:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    container_name: digico-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - digico-network

volumes:
  pglite_data:
    driver: local

networks:
  digico-network:
    driver: bridge
